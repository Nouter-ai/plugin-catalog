name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # added de cada entrada sale del primer commit que la agregó: hace falta el historial completo.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
      - run: node scripts/validate.ts
      - run: node scripts/build.ts "${GITHUB_REF_NAME}"
      # El OS de cada tenant sincroniza ramas, no tags (el lector de git solo sigue ramas): cada release empuja su rama
      # inmutable release/vN en el commit del tag. Falla solo si ya existe en OTRO commit; un re-run pasa.
      - run: node scripts/release-branch.ts "${GITHUB_REF_NAME}"
      - run: gh release create "${GITHUB_REF_NAME}" dist/directory.json --title "${GITHUB_REF_NAME}" --notes "Directory de plugins y skills ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
